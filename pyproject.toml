[project]
name = "aeris"
version = "0.1.0"
description = "AERIS — Autonomous Drone Intelligence Research Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sid" }]

# Core runtime dependencies (aeris.core; kept minimal — most functionality
# lives behind the extras below, added by the phase that first needs it).
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "mcap>=1.5",  # aeris.replay (spec §39.1, ADR-012): MCAP, pure-Python, no ROS required
]

[project.scripts]
# The `aeris` CLI needs aeris.simulation (pymavlink), so it only works with
# the "sim" extra installed — `uv sync --extra sim` (or `--extra dev`, which
# doesn't pull it in on its own; see Makefile/docs/mac-setup.md).
aeris = "aeris.cli:main"

[project.optional-dependencies]
# aeris.vehicle / aeris.simulation transport & sim-adjacent deps (Phase 3+).
# numpy/numba moved in here (Phase 11): ADR-0009's block-hashed voxel map +
# Numba ray integration needs them now, not just aeris.learning (Phase 13+)
# -- they were originally scoped to "learn" on the (correct, at the time)
# assumption that nothing before Phase 13 needed numpy. `learn` keeps its
# own copy below too since it independently needs both regardless of
# mapping's existence; uv/pip just resolve the union when both extras are
# requested, so the duplication is documentation, not a conflict.
sim = [
    "pymavlink>=2.4.50",
    "mavsdk>=4.0.0",
    "pyzmq>=26.2",
    "msgpack>=1.1",
    "numpy>=2.0",
    "numba>=0.60",
    # gz.msgs10's generated bindings import google.protobuf at the Python
    # level (docs/sensors.md) -- this was installed by hand into the venv
    # during Phase 8's investigation and never added here, a latent gap
    # `uv sync` just surfaced (Phase 11) by silently removing it as an
    # untracked package. Declaring it here is the actual fix.
    "protobuf>=5.0",
]
# aeris.learning envs/spaces only (Phase 13): FastSim + the Gymnasium envs
# need gymnasium but not torch, so CI installs this instead of `learn` and
# skips multi-GB torch wheels until a phase actually trains something.
gym = [
    "gymnasium>=1.0",
]
# aeris.learning deps (Phase 13+)
learn = [
    "torch>=2.14",
    "numpy>=2.0",
    "numba>=0.60",
    "gymnasium>=1.0",
]
# backend/app deps (Phase 25+)
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
]
# Everything needed to develop/test AERIS itself.
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",  # Phase 5+: aeris.safety and later async unit tests
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeris"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["aeris", "backend", "tests", "scripts"]
# AERIS_TECHNICAL_SPEC.md and docs/ contain illustrative Python snippets in
# fenced code blocks that are not meant to be reformatted as real source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "C4",               # comprehensions
    "RUF",              # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["aeris", "backend"]

# ---------------------------------------------------------------------------
# mypy — strict on the safety-critical/foundational packages per spec §14.2,
# relaxed elsewhere until those packages exist and are typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Spec §14.2: strict on aeris.core, aeris.vehicle, aeris.safety,
# aeris.learning.ppo (doesn't exist yet), aeris.evaluation.
# aeris.vehicle was missed here in Phase 4 -- added then. aeris.evaluation
# added now that Phase 7 creates it.
module = ["aeris.core.*", "aeris.vehicle.*", "aeris.safety.*", "aeris.evaluation.*"]
strict = true

[[tool.mypy.overrides]]
# Doesn't ship py.typed / stubs. pymavlink's own types are dynamically
# generated from the MAVLink XML dialect at install time anyway, so real
# stubs aren't practical to add here. (mavsdk itself isn't imported by
# any aeris module post-ADR-0003 -- see aeris/vehicle/px4_mavlink/__init__.py
# -- so it doesn't need an override here even though the "sim" extra still
# installs it, for re-testing the segfault against future releases.)
module = ["pymavlink.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No stubs/py.typed shipped.
module = ["msgpack.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Homebrew's gz-transport13/gz-msgs10 Python bindings (Phase 8) -- not a
# pip package, so no stubs are installable. Confined to
# aeris.simulation.bridge._gz_process by import-linter contract 5 (spec
# §14.3); that module is intentionally not in the strict override list
# above.
module = ["gz.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter — dependency contracts per spec §14.3.
# Contracts reference only packages that exist today; each later phase adds
# its own contract as it creates the corresponding package (see the
# commented-out block below for what's coming and when).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "aeris"
# Needed for the gz.*/rclpy contract below, whose forbidden_modules are
# external packages rather than something under aeris itself.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core.errors and core.types are dependency-free within aeris.core"
type = "independence"
modules = [
    "aeris.core.errors",
    "aeris.core.types",
    "aeris.core.units",
]

[[tool.importlinter.contracts]]
name = "core.clock/frames may depend on types/units/errors, not vice versa"
type = "layers"
layers = [
    "aeris.core.clock | aeris.core.frames",
    "aeris.core.config",
    "aeris.core.logging",
    "aeris.core.types | aeris.core.units | aeris.core.errors",
]

[[tool.importlinter.contracts]]
name = "vehicle.interface stays transport-agnostic: no adapter, no NED/FRD conventions"
type = "forbidden"
source_modules = ["aeris.vehicle.interface"]
forbidden_modules = [
    "aeris.vehicle.px4_mavlink",
    "aeris.core.frames.conventions",
]

[[tool.importlinter.contracts]]
name = "safety stays transport-agnostic too: only vehicle.interface, no adapter"
type = "forbidden"
source_modules = ["aeris.safety"]
forbidden_modules = [
    "aeris.vehicle.px4_mavlink",
    "aeris.core.frames.conventions",
]

[[tool.importlinter.contracts]]
name = "autonomy stays transport-agnostic too: only vehicle.interface, no adapter"
type = "forbidden"
source_modules = ["aeris.autonomy"]
forbidden_modules = [
    "aeris.vehicle.px4_mavlink",
    "aeris.core.frames.conventions",
]

[[tool.importlinter.contracts]]
name = "groundtruth is privileged: autonomy/perception/mapping/localization/learning must not import it (spec §17.4, §14.3 contract 1)"
type = "forbidden"
source_modules = ["aeris.autonomy", "aeris.perception", "aeris.mapping", "aeris.localization", "aeris.learning"]
forbidden_modules = ["aeris.simulation.groundtruth"]
# Widened to aeris.mapping/aeris.localization in Phase 11 and aeris.learning
# in Phase 13 (each when the package first exists to check).

[[tool.importlinter.contracts]]
name = "learning.spaces is deployment-shared: no simulator, no training envs (spec §27.6)"
type = "forbidden"
source_modules = ["aeris.learning.spaces"]
forbidden_modules = ["aeris.simulation", "aeris.learning.envs"]
# ObservationBuilder/ActionDecoder must run unchanged on a real vehicle's
# data (Tier H deployment); importing FastSim (or anything simulation-side)
# would make that impossible, and a GT leak easy. Phase 13 leakage audit.

[[tool.importlinter.contracts]]
name = "gz.*/rclpy are confined to the Sensor Bridge process (spec §14.3 contract 5)"
type = "forbidden"
source_modules = ["aeris"]
forbidden_modules = ["gz", "rclpy"]
ignore_imports = [
    # grimp records external-package imports at their top-level name only
    # (not the full submodule path), so this one line covers every
    # `gz.msgs10.*`/`gz.transport13` import in that file.
    "aeris.simulation.bridge._gz_process -> gz",
]

# Contracts to be ADDED (not yet, since the packages don't exist):
#   Phase 25:  "aeris must not import backend or frontend" (forbidden contract)
#   Phase 10+: "only aeris.vehicle.px4_mavlink (and later px4_mavsdk) may
#               import aeris.core.frames.conventions" (forbidden contract,
#               widened once autonomy/mapping/perception packages exist —
#               today only vehicle.interface is checked against it above,
#               since it's the only other package that could plausibly need it)

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no external services (default CI tier)",
    "sim: requires PX4 SITL + Gazebo running locally",
    "integration: requires SITL + AERIS processes together",
    "eval: long-running evaluation suites",
    "backend: FastAPI TestClient tests",
]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
