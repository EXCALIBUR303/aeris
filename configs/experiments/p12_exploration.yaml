# AERIS Phase 12's exploration experiment (spec §51 Phase 12, H0.1).
#
# 3 val-split worlds (one per procedural family -- f1_rubble/f2_office/
# f3_warehouse, seed 10000 each; f4_collapsed is pinned to test_ood only
# and never generated as val), 3 methods (random/nearest_frontier/
# utility_frontier), 3 repeats/pair -- 27 live episodes. See
# configs/experiments/preregistration/p12_h0_1.md for the full
# pre-registered hypothesis/metric/statistical-test/exclusion-rule
# record, and its own note on why val worlds specifically (the 5
# obstacle-suite worlds Phases 9-11 reused are test_id-tagged and are
# the wrong split for this phase's validation-worlds requirement).

experiment_id: p12_exploration
world_split: val
world_families:
  - f1_rubble
  - f2_office
  - f3_warehouse
seed_per_family: 10000  # the split's own first seed -- reproducible run to run

methods:
  - random
  - nearest_frontier
  - utility_frontier

n_repeats: 3  # spec §6's own stated minimum for classical methods in SITL
t_max_s: 180.0  # matches H0.1's own C(180s) metric exactly

hover_altitude_m: 1.0
# Episode validity (added in Phase 13 after instrumented re-runs found
# grounded Phase 12 episodes -- docs/exploration.md): an episode whose GT
# altitude leaves the world's altitude_band_m for longer than this in one
# stretch is recorded with status "invalid" (excluded from analysis), and
# out-of-band GT poses never count toward coverage in any episode.
max_altitude_excursion_s: 2.0
# Each world's own altitude_band_m (spec §33's generators; the WorldSpec
# default is 0.3-3.0m) is used as-is, not narrowed -- confirmed live
# (Phase 12) that a forward-looking depth camera flying level at a
# single hover altitude structurally cannot sweep every voxel of a
# multi-meter-tall band (every column stayed permanently UNKNOWN under
# the strict rule, even after many yaw rotations), but
# project_band's new free_rule="any_observed" mode
# (aeris/mapping/projection.py) resolves this on its own -- confirmed
# live with this exact band width (a live smoke-test episode using the
# unmodified 0.3-2.0m band succeeded once free_rule was switched, with
# no band-narrowing involved). See docs/exploration.md.

mapping:
  resolution_m: 0.2  # spec's own stated default -- these worlds' obstacles
  # aren't the sub-resolution-thin walls Phase 11's obstacle suites were,
  # so there's no resolution-quantization reason to deviate from it here.
  l_occ: 0.85
  l_free: -0.4
  l_min: -4.0
  l_max: 4.0
  max_range_m: 15.0

# The evaluator's own GT-coverage computation (reachable_free_cells_gt +
# running_coverage_trace) is deliberately coarser than the agent's own
# live mapping.resolution_m above -- confirmed live (timed directly, not
# guessed) that voxelizing one val world's full 24x24x6m bounds at 0.2m
# took 14.83s (432,000 voxels against 74 box primitives) vs 0.95s at
# 0.5m (2,304 reachable cells vs 14,400) -- a 15.6x cost matching the
# voxel-count ratio exactly. Coverage is a "did you see this general
# area" question, not an obstacle-detection question, so this coarser
# resolution doesn't compromise what C(t) is actually measuring; it must
# be applied identically to both reachable_free_cells_gt and
# running_coverage_trace, since their cell indices must match for the
# E_GT(t) ∩ F intersection to mean anything.
coverage_resolution_m: 0.5

inflation_m: 0.3  # vehicle-radius-plus-margin for A*/exploration planning;
# deliberately smaller than and independent of the collision shield's own
# d_safe_m=0.5 stopping margin (aeris/safety/shield.py) -- inflation keeps
# A* from planning paths that hug walls with zero clearance, the shield
# is the real-time safety net regardless of what the planner intended.

# Tuned via a 4-value grid search (0.0/0.5/1.0/2.0), n=1 episode each,
# on f1_rubble_10000 (results/experiments/p12_exploration/tuning.jsonl):
# coverage_final = 0.127/0.120/0.122/0.122 respectively. 0.0 scored
# nominally highest, but the full spread is well within the run-to-run
# SITL nondeterminism spec's own D1 documents (§40) at n=1/value -- this
# tuning budget cannot distinguish these values with any real
# confidence. 0.0 is used below as the (honestly weak) grid winner, not
# a strong finding; see the phase report.
utility_lambda_turn: 0.0

x_range_half_width_m: 8.0  # the BandGrid query window is [-8, 8] x [-8, 8]
# around each world's own spawn point -- generous relative to each
# procedural generator's own room/corridor scale (spec §33's generators),
# so exploration is never artificially capped by the query window itself
# before it's capped by what 180s of real flight can actually cover.
